name: Deploy Next.js to GitHub Pages (monorepo)
on:
  push:
    branches: ["devnet-zkApp"]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies and build core
        run: pnpm complete:core
        working-directory: .
      - name: Install dependencies and build ui
        run: pnpm complete:ui
        working-directory: .
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/ui/out